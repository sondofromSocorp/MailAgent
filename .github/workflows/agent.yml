name: MailAgent

on:
  # Toutes les 5 minutes (minimum autorise par GitHub ; heure UTC, best-effort = parfois decale).
  # Repo public => minutes illimitees. Le 'concurrency' ci-dessous evite tout chevauchement.
  schedule:
    - cron: "*/5 * * * *"
  # Bouton "Run workflow" pour lancer une passe a la demande (utile pour tester).
  workflow_dispatch:

# Empeche deux passes de tourner en meme temps.
concurrency:
  group: mailagent
  cancel-in-progress: false

# models: read permet au GITHUB_TOKEN automatique d'appeler GitHub Models (GPT gratuits,
# quota journalier) : premier maillon de la cascade LLM gratuite, sans aucune cle a creer.
permissions:
  contents: read
  models: read

jobs:
  run:
    runs-on: ubuntu-latest
    # 15 min : le budget interne (Agent:MaxRunSeconds=480) arrete les fournees a 8 min, mais une
    # fournee entamee peut deborder (attentes 429 des tiers gratuits) -- 10 min coupait en plein vol.
    timeout-minutes: 15
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Lancer une passe de l'agent
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          # Boites supplementaires : declarer chaque boite dans "Accounts" (appsettings.json)
          # avec ses UserEnv/PassEnv, creer les secrets, puis decommenter les lignes ici. Ex. :
          # IMAP_USER_PRO: ${{ secrets.IMAP_USER_PRO }}
          # IMAP_PASS_PRO: ${{ secrets.IMAP_PASS_PRO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Cascade LLM gratuite (Llm:Provider=free) : github -> groq -> gemini.
          # GitHub Models marche d'office via le token du job ; Groq et Gemini sont sautes
          # tant que leur cle n'existe pas dans les secrets du repo.
          GITHUB_MODELS_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Notification via bot Telegram (cf. README pour creer le bot et recuperer le chat id)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Agenda auto (Google Calendar) : inactif tant que ces trois secrets ne sont pas crees dans le repo.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: dotnet run --project MailAgent.csproj -c Release
